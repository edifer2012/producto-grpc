services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-producto}
      POSTGRES_USER: ${POSTGRES_USER:-producto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-producto}
    volumes:
      - producto_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-producto} -d ${POSTGRES_DB:-producto}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  producto-grpc:
    build: .
    environment:
      APP_NAME: ${APP_NAME:-producto-grpc}
      GRPC_HOST: 0.0.0.0
      GRPC_PORT: ${GRPC_PORT:-50051}
      GRPC_MAX_WORKERS: ${GRPC_MAX_WORKERS:-10}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://producto:producto@db:5432/producto}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${GRPC_PORT:-50051}:${GRPC_PORT:-50051}"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  producto_data:
